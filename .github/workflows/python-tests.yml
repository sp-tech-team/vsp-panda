name: Run browser tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  
  workflow_dispatch:
    inputs:
      base_url:
        description: "Streamlit URL to test"
        required: false
        default: ""
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
      BASE_URL: ${{ inputs.base_url || vars.VSP_BASE_URL || 'https://vsp-panda.streamlit.app/' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      working-directory: ./test_automation
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-test.txt

    - name: Install Playwright browser
      run: python -m playwright install --with-deps chromium

    - name: Run tests with pytest
      working-directory: ./test_automation
      run: |
        python -m pytest -v

    - name: Upload failure screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-failure-screenshots
        path: test_automation/screenshots/
        if-no-files-found: ignore
